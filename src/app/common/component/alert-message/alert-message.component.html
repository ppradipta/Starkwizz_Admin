<div style="background: white;height: 100%;">
  <div>

    <div class="d-flex justify-content-center">
      <p class="h3" style="padding-top: 40px;">{{header}}</p>
    </div>
    <div class="d-flex justify-content-center" style="padding:5%;">
      <p style="text-align: center;font-size: 20px;
      line-height: 30px;">{{message?.displayText}}</p>
    </div>
  </div>
  <ion-toolbar mode="md" position="bottom" style="position: fixed;
  bottom: 10%;">
    <div class="footer-toolbar ion-text-center p-2">
      <ion-button mode="md" size="medium" class="cancel-alert-btn" (click)="cancel()">Cancel</ion-button>
      <ion-button mode="md" size="medium" class="confirm-alert-btn" (click)="success()">Confirm</ion-button>
    </div>
  </ion-toolbar>
</div>
