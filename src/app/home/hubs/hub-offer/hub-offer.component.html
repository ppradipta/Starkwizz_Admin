<ion-header>
  <div class="heading-left">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Hub Offers</ion-title>
  </div>
</ion-header>

<ion-content>
  <div class="page-container">
    <div class="d-flex justify-content-end">
      <ion-button mode="md" fill="outline" class="add-btn" (click)="addOffersForHub()">Add Offers</ion-button>
    </div>
    <div class="card-container">
      <ion-card *ngFor="let hubOffers of offers;">
        <ion-card-content>
          <div class="d-flex justify-content-between">
            <div class="offer-info">
              <h3>{{hubOffers?.name}}</h3>
              <p>{{hubOffers?.description}}</p>
            </div>
            <div class="d-flex justify-content-between flex-column">
              <div class="offer-img">
                <ion-img [src]="hubOffers?.photos"></ion-img>
              </div>
              <!-- <div class="right-arrow">
                <ion-icon name="chevron-forward-circle"></ion-icon>
              </div> -->
            </div>
          </div>
        </ion-card-content>
      </ion-card>
    </div>
  </div>
  </ion-content>
