<ion-header>
  <div class="heading-left">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Hub Notices</ion-title>
  </div>
</ion-header>

<ion-content>
  <div class="page-container">
    <div class="d-flex justify-content-end">
      <ion-button mode="md" fill="outline" class="add-btn" (click)="addNoticesForHub()">Add Notice</ion-button>
    </div>
    <div class="card-container">
      <ion-card *ngFor="let notice of notices">
        <ion-card-header>
          <img [src]="notice?.photos">
        </ion-card-header>
        <ion-card-content>
          <div>
            <p>{{notice.description}}</p>
          </div>
        </ion-card-content>
      </ion-card>

    </div>

  </div>
</ion-content>
