<ion-header>
  <div class="header">
    <ion-title>Videos</ion-title>
  </div>
</ion-header>
<ion-content>
  <div class="page-container">
    <div class="customSegment">
      <ion-segment mode="md" (ionChange)="tabChanged($event)" [value]="tabValue" mode="md" color="secondary">
        <ion-segment-button mode="md" value="POSTED">
          <ion-label>Requested</ion-label>
        </ion-segment-button>
        <ion-segment-button mode="md" id="PUBLISHED" class="segmentBtn" value="APPROVED">
          <ion-label>Approved</ion-label>
        </ion-segment-button>

        <ion-segment-button mode="md" id="PUBLISHED" class="segmentBtn" value="REJECTED">
          <ion-label>rejected</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>

    <div class="card-container">
      <div *ngFor="let item of videoList; let i = index" class="custom-card">
        <div class="card-img">
          <!-- <ion-img *ngIf="item.imageUrl=='' || item.imageUrl==null" src="assets/images/menu-user.svg">
          </ion-img>
          <ion-img *ngIf="item.imageUrl!='' || item.imageUrl!=null" [src]="item.imageUrl">
          </ion-img> -->
          <ion-img [src]="item.imageUrl[0]?item.imageUrl[0]:'https://daisy.org/wp-content/uploads/2018/11/book-dark-enlightenment-1029141-1024x683.jpg'"></ion-img>
          <div class="video-status" [ngClass]="{'approved': item?.status === 'APPROVED', 'rejected': item?.status === 'REJECTED'}">{{item?.status}}</div>
        </div>
        <div class="card-body">
          <ion-label class="card-heading">{{item?.videoText}}</ion-label>
          <span class="by-name">by {{item.userName}}</span>
          <p class="card-desc" *ngIf="item?.discription">
            {{item?.discription}}
          </p>
          <div class="info-container">
            <div class="video-info">
              <span> Uploaded Date:</span>
              <ion-label class="card-label">{{item?.uploadDate}}</ion-label>
            </div>
            <div class="video-info">
              <span>Submit For Approval Date</span>
              <ion-label class="card-label">{{item?.submitForApprovalDate}}</ion-label>
            </div>
            <div class="video-info" *ngIf="item.status=='REJECTED'">
                <span>Remarks</span>
                <ion-label class="card-label">{{item?.remarks}}</ion-label>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <ion-button (click)="approved(item, 'APPROVED')"  [ngClass]="{'w-100': item?.status === 'REJECTED'}">Approved</ion-button>
          <ion-button class="reject-btn" (click)="reject(item, 'REJECTED')" *ngIf="item.status!='REJECTED'">Reject</ion-button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
