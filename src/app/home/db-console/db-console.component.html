<ion-header>
  <div class="header">
    <ion-title>DB-Console</ion-title>
  </div>
</ion-header>
<ion-content>
  <div class="page-container">
    <div class="card-container">
      <div class="custom-card col-md-6">
        <div class="card-title">
          <ion-select  placeholder="Class" mode="ios" (ionChange)="selectCollection($event)">
            <ion-select-option *ngFor="let colName of collectionNames" [value]="class">{{colName}}</ion-select-option>
          </ion-select>
        </div>
        <mat-form-field appearance="standard">
          <mat-label>Filter</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
        </mat-form-field>
        <div class="w-100 overflow-auto">
          <table mat-table [dataSource]="dataSource" matSort>
            <ng-container *ngFor="let disCol of (displayedColumns$ | async); let colIndex = index"
              matColumnDef="{{disCol}}">
              <th mat-header-cell *matHeaderCellDef>{{disCol}}</th>
              <td mat-cell *matCellDef="let element">{{element[disCol]}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="(displayedColumns$ | async)"></tr>
            <tr mat-row *matRowDef="let row; columns: (displayedColumns$ | async);"></tr>
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
            </tr>
          </table>
          <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"
            #MatPaginator1></mat-paginator>
        </div>
      </div>
    </div>
  </div>
</ion-content>
