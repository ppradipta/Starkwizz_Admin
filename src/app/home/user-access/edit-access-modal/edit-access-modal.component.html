<ion-header mode="md">
  <ion-toolbar mode="md">
    <ion-title>
      Edit Access
    </ion-title>
    <ion-buttons slot="end">
      <ion-button mode="md" (click)="close()" class="btn-blue modal-close">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="content modal-inner">
    <form name="Access">
      <ion-list>
        <ion-item *ngFor="let acs of user.acess">
          <ion-label>{{acs.name}}</ion-label>
          <ion-toggle [checked]="acs.isSelected"
          (ionChange)="updateSelectedAcess($event,acs)"></ion-toggle>
        </ion-item>
      </ion-list>
    </form>
    <ion-button class="secondary-btn" (click)="close()">close
    </ion-button>
    <ion-button class="secondary-btn"  (click)="confirmChangesForAcess()">Proceed
    </ion-button>
  </div>
</ion-content>
